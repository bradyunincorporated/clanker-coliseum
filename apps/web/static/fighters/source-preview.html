<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New fighter source packs</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #17212b; color: #f3e9d2; font: 16px system-ui, sans-serif; padding: 16px; }
  main { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px; height: 100%; }
  article { min-height: 0; display: flex; flex-direction: column; background: #263442; border-radius: 12px; overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 12px; }
  h2 { margin: 0; font-size: 18px; }
  select { max-width: 60%; font: inherit; padding: 6px; color: inherit; background: #17212b; border: 1px solid #678; border-radius: 6px; }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
</style>
</head>
<body>
<main id="packs"></main>
<script type="module">
const species = ['blastoise', 'raichu', 'scyther', 'hitmonlee'];
const names = ['Blastoise', 'Raichu', 'Scyther', 'Hitmonlee'];
const actions = ['idle', 'walkForward', 'walkBack', 'jump', 'jumpForward', 'crouch',
  'block', 'crouchBlock', 'hitstun', 'knockdown', 'ko', 'victory'];

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = src;
  });
}

function paintFrame(context, pack, name, x = 0, y = 0) {
  const entry = pack.atlas.frames[name];
  if (!entry) return;
  const frame = entry.frame;
  const source = entry.spriteSourceSize;
  context.drawImage(pack.image, frame.x, frame.y, frame.w, frame.h,
    source.x + x, source.y + y, source.w, source.h);
}

function paintAnimation(context, pack, name, progress, x = 0, y = 0) {
  const sequence = pack.atlas.animations[name];
  if (!sequence?.length) return;
  const index = Math.min(sequence.length - 1, Math.floor(progress * sequence.length));
  paintFrame(context, pack, sequence[index], x, y);
}

async function createPack(id, name) {
  const base = `/fighters/${id}/`;
  const [atlas, metadata] = await Promise.all([
    fetch(`${base}${id}.json`).then(response => response.json()),
    fetch(`${base}fighter-art.json`).then(response => response.json()),
  ]);
  const image = await loadImage(base + atlas.meta.image);
  const article = document.createElement('article');
  const header = document.createElement('header');
  const title = document.createElement('h2');
  title.textContent = name;
  const select = document.createElement('select');
  select.setAttribute('aria-label', `${name} animation`);
  for (const action of actions) {
    select.add(new Option(action, action));
  }
  for (const [key, move] of Object.entries(metadata.artGuides.moves)) {
    select.add(new Option(move.name, key));
  }
  const stage = document.createElement('div');
  stage.className = 'stage';
  const canvas = document.createElement('canvas');
  canvas.width = 800;
  canvas.height = 520;
  stage.append(canvas);
  header.append(title, select);
  article.append(header, stage);
  document.getElementById('packs').append(article);
  const context = canvas.getContext('2d');
  context.imageSmoothingEnabled = false;
  const pack = { atlas, metadata, image };
  let start = performance.now();
  select.addEventListener('change', () => { start = performance.now(); });

  function render(now) {
    context.clearRect(0, 0, 800, 520);
    context.strokeStyle = '#56616d';
    context.beginPath();
    context.moveTo(0, 468);
    context.lineTo(800, 468);
    context.stroke();
    const action = select.value;
    const elapsed = now - start;
    const move = metadata.artGuides.moves[action];
    if (move) {
      const tick = (elapsed % 1400) / 1000 * 60;
      let phase = 'windup';
      let phaseStart = 0;
      let duration = move.startup;
      if (tick >= move.startup + move.active) {
        phase = 'recover';
        phaseStart = move.startup + move.active;
        duration = move.recovery;
      } else if (tick >= move.startup) {
        phase = 'strike';
        phaseStart = move.startup;
        duration = move.active;
      }
      if (tick >= move.startup + move.active + move.recovery) {
        paintAnimation(context, pack, 'idle', 0);
      } else {
        paintAnimation(context, pack, `${action}_${phase}`, (tick - phaseStart) / duration);
      }
      if (phase === 'strike') {
        const box = move.hitbox;
        paintAnimation(context, pack, `${action}_fx`, (tick - phaseStart) / duration,
          (box.x + box.w / 2) * 2, 208 - (box.y + box.h / 2) * 2);
      }
    } else {
      const duration = metadata.sprites.loops?.[action] ?? 1000;
      paintAnimation(context, pack, action, (elapsed % duration) / duration);
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

for (let index = 0; index < species.length; index++) {
  await createPack(species[index], names[index]);
}
</script>
</body>
</html>
